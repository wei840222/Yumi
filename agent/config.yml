setupVersion: 2
modelRoles:
  default: openai/gpt-5.6-terra:high
  smol: bifrost/kimi-k2.5
  slow: bifrost/minimax-m2.5:high
  plan: openai/gpt-5.6-sol:medium
  vision: bifrost/qwen3.7-plus
theme:
  dark: dark-retro
  light: light-retro
symbolPreset: nerd
statusLine:
  transparent: true
  compactThinkingLevel: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  shimmer: classic
  showTurnTime: true
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
lsp:
  formatOnWrite: true
readLineNumbers: true
read:
  renderMarkdown: true
astGrep:
  enabled: true
vault:
  enabled: true
github:
  enabled: true
task:
  eager: preferred
  enableEffort: true
  enableLsp: true
  showResolvedModelBadge: true
searxng:
  endpoint: https://searxng.example.com
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
tui:
  textSizing: false
  codexResetFireworks: true
terminal:
  showProgress: true